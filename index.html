<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A birthday letter</title>
  <link rel="stylesheet" href="styles.css?v=20261030b">
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div><div class="wash" aria-hidden="true"></div>
  <main class="page" id="page" data-step="1">
    <header class="heading"><span class="eyebrow">A little something for you</span><h1 id="heading">choose your <em>envelope!</em></h1></header>
    <section class="chooser" aria-label="Make your birthday letter">
      <div class="rail rail-primary"><span class="rail-title" id="primary-label">envelope</span><div class="choices" id="envelope-choices" aria-label="Envelope colors"></div><div class="choices" id="letter-choices" aria-label="Letter papers" hidden></div><div class="choices" id="card-choices" aria-label="Photo card designs" hidden></div><div class="choices" id="cake-choices" aria-label="Birthday cakes" hidden></div><div class="choices" id="gift-choices" aria-label="Choose gifts" hidden></div></div>
      <div class="stage"><div class="stage-halo" aria-hidden="true"></div><img id="main-envelope" src="assets/envelope-sample-1.webp" alt="Open pink envelope" draggable="false"><div class="paper-frame" id="paper-frame" hidden><img id="main-letter" src="assets/letter-1.webp" alt="Selected letter paper" draggable="false"><textarea id="letter-text" aria-label="Write your birthday letter" placeholder="Dear you,&#10;&#10;" spellcheck="false"></textarea></div><div class="card-stack" id="card-stack" hidden><div class="card-frame" id="card-frame"><img id="main-card" src="assets/card-1.webp" alt="Selected birthday photo card" draggable="false"><div class="photo-mat" id="photo-mat" hidden><canvas id="card-photo" role="img" aria-label="Your cropped photo"></canvas></div></div><div class="photo-actions"><button class="upload-button" id="upload-button" type="button">＋ <span>add a photo</span></button><button class="upload-button" id="adjust-button" type="button" hidden>✧ <span>adjust</span></button></div><input id="photo-input" type="file" accept="image/*" hidden></div><div class="cake-frame" id="cake-frame" hidden><img id="main-cake" src="assets/cake-3.webp" alt="Selected birthday cake" draggable="false"><div class="cake-eraser" aria-hidden="true"></div><div class="placed-candle" id="placed-candle" hidden><span class="flame" id="flame"></span></div></div><div class="preview-grid" id="preview-grid" hidden><button class="preview-tile" type="button" data-preview="envelope"><img id="preview-envelope" alt="Selected envelope"><span>envelope</span></button><button class="preview-tile" type="button" data-preview="letter"><img id="preview-letter" alt="Your letter"><span>letter</span></button><button class="preview-tile" type="button" data-preview="photo"><img id="preview-photo" alt="Selected photo card"><span>photo card</span></button><button class="preview-tile" type="button" data-preview="cake"><img id="preview-cake" alt="Selected cake"><span>cake</span></button></div><div class="gift-scene" id="gift-scene" hidden><div class="age-balloons" id="age-balloons"></div><button class="gift-piece gift-letter" data-gift-preview="letter" type="button" aria-label="View letter"><img id="gift-letter-img" alt=""><span class="gift-letter-ink" id="gift-letter-ink"></span></button><button class="gift-piece gift-card" data-gift-preview="photo" type="button" aria-label="View photo card"><img id="gift-card-img" alt=""></button><button class="gift-piece gift-cake" data-gift-preview="cake" type="button" aria-label="View cake"><img id="gift-cake-img" alt=""></button><div id="gift-decorations"></div><div class="gift-flap"></div><div class="gift-envelope" id="gift-envelope"></div><div class="sealed-envelope" id="sealed-envelope" aria-hidden="true"><div class="sealed-flap"></div><div class="sealed-seal"></div></div></div></div>
      <div class="rail rail-background" id="background-rail"><span class="rail-title">background</span><div class="choices" id="background-choices" aria-label="Background patterns"></div></div>
      <div class="rail rail-age" id="age-rail" hidden><label class="rail-title" for="age-input">birthday age</label><input id="age-input" type="text" inputmode="numeric" maxlength="2" value="21" aria-label="Birthday age"></div><div class="rail rail-tools" id="cake-tools" hidden><span class="rail-title">make a wish</span><button class="cake-tool" id="match-tool" type="button" aria-label="Light the candle"><svg viewBox="0 0 40 64" aria-hidden="true"><path d="M12 55L27 17" stroke="#a37a5b" stroke-width="4" stroke-linecap="round"/><path d="M27 16c-5-5-2-11 3-12 6 4 6 10-3 12Z" fill="#c77f6b" stroke="#8e6258" stroke-width="1.5"/></svg><span>match</span></button><span class="tool-hint" id="cake-hint" role="status" aria-live="polite"></span></div>
    </section>
    <footer><button class="back" id="back-button" type="button" aria-label="Previous step" hidden><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M12 49 45 14M42 11l7 7M19 16l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM42 35l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5zM8 38l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></svg><span>back</span></button><span class="step" id="step-count">01 <i></i> 06</span><button class="quill-button" id="next-button" type="button" aria-label="Next step"><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M11 51c12-11 21-24 34-43 4 9 5 18 1 26-5 10-16 12-27 12"/><path d="M19 46c8-8 16-15 25-24M26 39l-1-10M33 32l-1-10M37 29l9-2"/><path d="M10 51l-4 4"/></svg><span>next</span></button><button class="replay-button" id="replay-button" type="button" hidden>↻ replay</button></footer>
  </main>
  <dialog class="preview-dialog" id="preview-dialog" aria-label="Preview item"><button id="preview-close" type="button" aria-label="Close preview">×</button><div id="preview-detail"></div></dialog>
  <dialog class="photo-editor" id="photo-editor" aria-labelledby="editor-title"><div class="editor-head"><h2 id="editor-title">adjust your photo</h2><button id="editor-close" type="button" aria-label="Close photo editor">×</button></div><div class="crop-preview" id="crop-preview"><canvas id="crop-canvas" role="img" aria-label="Photo crop preview"></canvas></div><p class="drag-hint">drag to position</p><div class="format-buttons"><button type="button" data-format="portrait">portrait</button><button type="button" data-format="landscape">landscape</button></div><label class="zoom-control">zoom <input id="zoom-slider" type="range" min="1" max="3" step="0.01" value="1"></label><button class="editor-done" id="editor-done" type="button">done</button></dialog>
  <dialog class="wish-dialog" id="wish-dialog" aria-labelledby="wish-title"><div class="wish-room" id="wish-room"><button class="wish-close" id="wish-close" type="button" aria-label="Close wish scene">×</button><p class="wish-kicker">a little birthday wish</p><h2 id="wish-title">make a <em>wish.</em></h2><div class="wish-art" id="wish-art"><img id="wish-cake" alt="Your birthday cake"><span class="wish-darken" aria-hidden="true"></span><span class="wish-candle" aria-hidden="true"><span class="wish-flame"></span><span class="wish-smoke"></span></span></div><p class="wish-status" id="wish-status" role="status" aria-live="polite">Light the candle</p><div class="wish-controls"><button id="wish-light" type="button">✧ light the candle</button><button id="wish-mic" type="button" hidden>◌ blow into the microphone</button><button id="wish-blow" type="button" hidden>blow out by touch</button></div></div></dialog>
  <script src="script.js"></script>
</body>
</html>
